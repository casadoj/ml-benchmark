# Benchmark experiments: training experiments and their test experiments.
#
# Structure
# ---------
# <TRAINING_EXPERIMENT>:          # e.g. ESD_pseudo_reality, Emulator_hist_future
#   <TEST_EXPERIMENT>:            # e.g. Perfect_cross_validation
#     horizon: <HORIZON>          # historical | mid_century | end_century
#     case: <CASE>                # perfect | imperfect
#     transfer: <BOOL>            # true | false
#
# Fields
# ------
# horizon   Test horizon. Each horizon is a fixed 20-year period:
#           historical = 1981-2000, mid_century = 2041-2060,
#           end_century = 2080-2099.
# case      Predictors used in the test: `perfect` = upscaled from the RCM,
#           `imperfect` = raw from the driving GCM.
# transfer  GCM transferability test: `false` = same GCM as in training
#           (`train_gcm` in datasets.yaml), `true` = different GCM
#           (`test_gcm` in datasets.yaml).
#
# A test spanning several horizons lists them in `horizon`, e.g.
#     horizon: [mid_century, end_century]

ESD_pseudo_reality:
  Perfect_cross_validation:
    horizon: historical
    case: perfect
    transfer: false
  Imperfect_cross_validation:
    horizon: historical
    case: imperfect
    transfer: false
  Perfect_extrapolation:
    horizon: mid_century
    case: perfect
    transfer: false
  Imperfect_extrapolation:
    horizon: [mid_century, end_century]
    case: imperfect
    transfer: false
  Perfect_extrapolation_transfer:
    horizon: [mid_century, end_century]
    case: perfect
    transfer: true
Emulator_hist_future:
  Perfect_cross_validation:
    horizon: historical
    case: perfect
    transfer: false
  Imperfect_cross_validation:
    horizon: historical
    case: imperfect
    transfer: false
  Perfect_interpolation:
    horizon: mid_century
    case: perfect
    transfer: false
  Imperfect_interpolation:
    horizon: mid_century
    case: imperfect
    transfer: false
  Perfect_interpolation_transfer:
    horizon: [mid_century, end_century]
    case: perfect
    transfer: true
  Imperfect_interpolation_transfer:
    horizon: [mid_century, end_century]
    case: imperfect
    transfer: true
