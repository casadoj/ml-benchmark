# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) by submission/register.py when a maintainer adds the
# label `Approved submission` (.github/workflows/submission.yml), and it is the
# source of the table of contributing models (docs/results/models.md). Edit it by
# hand only to fix mistakes or fill the fields the form does not ask for; never edit
# the models table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field, except
# `description`, which is the field `emulator`):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the models table (not
#                            in the form: filled by a maintainer).
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the models table, e.g.
#                            "Author et al., 2025" (not in the form: filled by a
#                            maintainer). null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
#                            Several references: give reference_label and
#                            reference_url as lists of the same length.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `Approved submission` label was added
#                            (YYYY-MM-DD, UTC).
# blind                      From the form field "Dataset release": true if the
#                            predictions were produced before the public release of
#                            the test dataset (pre-release), false if after
#                            (post-release), null if unknown.
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.

# --- Submission issue ---------------------------------------------------------
emulator_id: ViT-IFCAv1-orog
institution_id: IFCA
institution: Instituto de Física de Cantabria (IFCA), CSIC-Universidad de Cantabria
short_description: Vision Transformer (ViT)
description: |-
  This emulator is based on the Vision Transformer (ViT) architecture [1]. The large-scale predictors are partitioned into patches, embedded, and passed through a series of Transformer blocks. The resulting patch representations are then upscaled to match the resolution of the local-scale predictand. As loss function it uses the CRPS-Spectral [2]. The noise is inyected in the ViT through conditional layer normalization [3]. Orography is added to the final embeddings of the Transformer block.

  Input data are standardized at the grid-point level using the mean and standard deviation of the predictors corresponding to each training experiment. Models are trained for a variable number of epochs, determined via an early-stopping strategy based on a randomly split validation dataset.
hardware_training_details: |-
  The model was trained on two V100 (32GB) GPUs using DDP. Each epoch takes approximately 30–40 seconds.
stochastic_output: true
reference_label: null
# reference_url in the issue: In preparation
reference_url: null
reproducibility_url: https://github.com/jgonzalezab/ViT_CORDEX-ML-Bench
additional_notes: null

