# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) when a maintainer adds the `approved` label, and it
# is the source of the "Models contributing to the benchmark" table in README.md.
# Edit it by hand only to fix mistakes; never edit the README table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the README table.
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the README table, e.g.
#                            "Author et al., 2025". null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `approved` label was added (YYYY-MM-DD, UTC).
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.
#

# --- Submission issue ---------------------------------------------------------
emulator_id: ResGAN
institution_id: ESNZ
institution: Earth Sciences New Zealand (ESNZ; Formerly NIWA)
short_description: Residual WGAN (U-Net mean + GAN residual)
description: |-
  **Model Architecture**
  This is ResGAN without an orography co-variate.
  We implement a residual GAN approach following Rampal et al. (2025), using a U-Net to predict the mean state and a residual GAN to predict differences between ground truth and U-Net predictions. Our implementation uses a Wasserstein GAN with several key modifications:
  Architecture: The model employs residual layers and U-Net-style architecture with low-resolution fields that interact at the latent space level without upsampling. Self-attention is applied at the latent stage. FiLM layers incorporate day-of-year embeddings, and channel attention is used throughout the network. The GAN contains approximately 3 million parameters, while the U-Net contains 2 million. Code is available at: https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models.
  Note: this architecture does not include topography as a co-variate.

  **Loss Functions**: We use an adversarial loss weight of 0.01. Unlike Rampal et al. (2025), who used a global intensity constraint, we apply a pooled maximum intensity constraint that computes maximum intensity across a region using MSE weighted 4.25 times.
  Training Configuration: The model uses Adam optimizer with learning rate decay (initial rate: 1.5 × 10⁻⁵, decay rate: 0.9985 per 1000 steps) and batch size of 16. No batch normalization is applied. Three years of training data per simulation are used for validation (both ESD and Emul_hist_future variants). All hyperparameters are specified in the config files.

  **Normalization**: Variables are trained independently. Precipitation undergoes log normalization: z = logₑ(pr + 1) with leaky ReLU activation for U-Net and linear activation for GAN. Temperature is normalized by grid-point-specific mean and standard deviation. Predictor variables are normalized by spatiotemporal mean: (X - X.mean("time","lat","lon"))/X.std("time").mean("lat","lon"). Static predictors use global min-max normalization. Training normalization factors are reapplied during inference.
hardware_training_details: |-
  Training is performed on a single A100 GPU with 10 CPUs and 120GB RAM. ESD runs require approximately 130 seconds per epoch (12.5 hours for 250 epochs), while Emul_hist_future runs require 287 seconds per epoch (20 hours for 250 epochs).
  Inference takes 0.8-1.2 seconds per year per ensemble member on an A100 GPU, excluding data processing time. For example, generating 5 members over 20 years requires approximately 80-120 seconds (5 members × 0.8-1.2 seconds × 20 years).
stochastic_output: true
reference_label: Rampal et al., 2025
# reference_url in the issue: https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models, https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models
reference_url: https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2024MS004668
reproducibility_url: https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models
additional_notes: null

