emulator_id: RCMFlow-orog  # in the issue: RCMFlow_orog
institution_id: ESNZ
institution: Earth Sciences New Zealand
short_description: null
description: |-
  The emulator uses a conditional flow matching framework (Lipman et al., 2022; Liu et al., 2022) to independently downscale daily precipitation and maximum temperature. A single model is trained per variable, predicting the full high-resolution field directly rather than as a residual correction.
  Architecture. The network is a velocity-predicting UNet with approximately 4.5 million parameters, sharing the same encoder–decoder structure as ResGAN_orog. It comprises a high-resolution branch (three down-blocks with channel, CBAM, and no attention respectively), a low-resolution branch (four residual blocks processing the large-scale predictor fields), a bottleneck that merges both branches via self-attention, and a symmetric decoder with skip connections. A flow time embedding — generated via sinusoidal encoding and projected to 256 dimensions — is injected throughout the network at each scale using FiLM residual blocks (FiLMResidual), allowing the network to condition on the current position along the flow trajectory. Seasonal conditioning is applied to both the low-resolution predictors and the noisy high-resolution field via a separate FiLM layer (TimeFilmLayer) using sinusoidal day-of-year encoding. Orography is provided as an additional high-resolution static input channel.
  **Flow matching formulation.** Training follows a rectified flow (linear interpolant) schedule: the interpolated state at time *t* is xt=(1−t)x0+tx1​, and the velocity target is v=x1−x0​. The noise prior
  x0​ is Gaussian with standard deviation σz\sigma_z
  σz​, which is updated online via exponential moving average of the target field's standard deviation (EMA decay 0.01, clipped to [0.3, 2.0]). An EMA copy of the network weights (decay 0.999) is maintained and used for validation and inference.

  Loss function. The training loss is MSE between predicted and target velocity, plus a normalisation regularisation term λ⋅E[(x1/σz)2] with λ=0.1,

  Optimizer and learning rate. Adam optimizer with an initial learning rate of 3×10^-5
  3×10−5 and exponential decay (rate 0.996). Models are trained for 500 epochs with a batch size of 16 on a single NVIDIA A100 GPU.

  Input standardization. Precipitation is log-transformed as ln⁡(pr+1). Temperature is standardized per-pixel using the climatological mean and standard deviation. Large-scale predictor fields are conditioned via FiLM layers without explicit z-score normalization.

  Inference. Samples are generated by integrating the learned velocity field from t=0
  t=0 to t=1 using a 3rd-order Adams–Bashforth (AB3) solver with 30 function evaluations, with Euler and AB2 warm-up steps for the first two iterations and light damping (β=0.1) applied from step 3 onward.
hardware_training_details: |-
  Training took 20s per epoch (ESD) and 40s per epoch (Emul_hist_future), with models trained for 495 epochs using final-epoch weights and exponential learning rate decay. All training and inference was performed on a single A100 GPU.
  Inference generated 20 years of precipitation data per ensemble member in approximately 4m 42s (ESD) and 5m 42s (Emul_hist_future), equivalent to roughly 15s per year — around 15× slower than ResGAN.
