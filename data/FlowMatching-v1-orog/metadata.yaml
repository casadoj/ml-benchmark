# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) when a maintainer adds the `approved` label, and it
# is the source of the "Models contributing to the benchmark" table in README.md.
# Edit it by hand only to fix mistakes; never edit the README table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the README table.
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the README table, e.g.
#                            "Author et al., 2025". null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `approved` label was added (YYYY-MM-DD, UTC).
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.
#

# --- Submission issue ---------------------------------------------------------
emulator_id: FlowMatching-v1-orog
institution_id: MO
institution: Met Office
short_description: Flow matching + ADM U-Net
description: |-
  Flow matching model, with a U-Net neural network.

  **Predictors**
  u, v, q, t, z at multiple pressure levels, normalised with z-score normalisation.

  **Targets**
  pr or tasmax; pr normalised with log1p + z-score normalisation, tasmax with z-score normalisation.

  **Training configuration**
  Adam optimiser.

  ```
  training:
    learning_rate: 0.0001
    epochs: 50
    batch_size: 64
    patience: 10
    years:
      Emulator_hist_future:
        [
          "1961-1966",
          "1968-1974",
          "1976-1980",
          "2080-2086",
          "2088-2094",
          "2096-2099",
        ]
      ESD_pseudo_reality: ["1961-1978"]

  validation:
    years:
      Emulator_hist_future: ["1967", "1975", "2087", "2095"]
      ESD_pseudo_reality: ["1979-1980"]
  ```

  **Network configuration**
  ADM U-net with:

  ```
  model:
    img_resolution: 128
    model_channels: 128
    channel_mult: [1, 2, 2, 2, 2]
    channel_mult_emb: 2
    num_residual_blocks: 2
    attention_resolutions: [8]
    dropout: 0.1
  ```

  **Flow Matching Hyperparameters**

  ```
  scheduler:
    type: condot

  source:
    type: gaussian
    mean: 0.0
    std: 1.0
  ```

  **Other**

  Seperate models were trained for predicting precipitation and temperature. Submission includes predictions both with and without orography as a predictor.
hardware_training_details: |-
  The models were trained on a single H100 node (94 GB VRAM).

  Each model took ~45 minutes to train (50 epochs, so ~54 seconds per epoch).

  Inference took 2-3 minutes per year of predictions (with a batch size of 256, which used 52 GB of VRAM).
stochastic_output: true
reference_label: Wetherell 2026
# reference_url in the issue: https://github.com/mo-tomaswetherell/mo-flow-cordexbench
reference_url: https://arxiv.org/abs/2606.00281
reproducibility_url: https://github.com/mo-tomaswetherell/mo-flow-cordexbench
additional_notes: null

