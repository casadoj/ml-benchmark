# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) when a maintainer adds the `approved` label, and it
# is the source of the "Models contributing to the benchmark" table in README.md.
# Edit it by hand only to fix mistakes; never edit the README table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the README table.
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the README table, e.g.
#                            "Author et al., 2025". null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `approved` label was added (YYYY-MM-DD, UTC).
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.
#

# --- Submission issue ---------------------------------------------------------
emulator_id: RCMGEM-orog  # in the issue: RCMGEM-mv-orog
institution_id: UoB
institution: University of Bristol
short_description: NCSN++ diffusion (sub-VP SDE)
description: |-
  RCMGEM is a diffusion model based on work by Song et al. [1], including the hyperparameters (including definision of stochastic differential equation (SDE) that defines the noise-adding process), network architecture and training procedure.

  * SDE formulation: sub-Variance-Preserving (``sub-VP")
  * Neural network: NCSN++, an improved version of their original Noise Conditional Score Network (NCSN) based on the U-Net architecture used by Ho et al. [2].
  * Optimizer: Adam optimizer with learning rate 0.0002.

  Uses orography as an input as well as the coarse conditioning variables.

  Withheld years 1967, 1975, 2087, 2095 from training set to use as validation set.

  Number of epochs depends on domain and training experiment. Epoch chosen for inference based on loss and key metrics (seasonal mean bias, power spectral density, correlation between predictions and RCM truth) on validation subset. Chosen epochs were:

  * Emulator Historic Future training experiment:
    * ALPS: 540
    * NZ: 260
    * SA: 560
  * ESD pseudo reality training experiment:
    * ALPS: 1000
    * NZ: 300
    * SA: 2000

  [1] Song, Yang and Sohl-Dickstein, Jascha and Diederik and Kumar, Abhishek and Ermon, Stefano and Poole, Ben. (2021). "Score-Based Generative Modeling through Stochastic Differential Equations". ICLR. https://openreview.net/forum?id=PxTIG12RRHS
  [2] Ho, J., Jain, A., & Abbeel, P. (2020). "Denoising diffusion probabilistic models". NeurIPS.
hardware_training_details: |-
  Training and some inference done using ORCHID on JASMIN: One node with one NVIDIA A100 GPU ()

  * Training time ~6 minutes per epoch for Emulator_historic_future training experiment and ~3 minutes per epoch for ESD_pseudo_reality training experiment.
  * Inference time ~40 minutes per year

  Some inference done using Isambard-AI: One node with one H100 Tensor Core GPU (96GB).

  * Inference time ~20 minutes per year.
stochastic_output: true
reference_label: Addison et al., 2026
# reference_url in the issue: https://arxiv.org/abs/2407.14158
reference_url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005140
reproducibility_url: https://zenodo.org/records/18481925
additional_notes: |-
  I settled on version with orography before the announcement to do both or prioritise without. In my own evaluation there was not a large difference in evaluation performance and possibly required more epochs to converge (not fully explored). I lack time to generate predictions for non-orography.

  Linked arxiv paper describing model has recently been accepted by JAMES.

  Respository for Reproducibility points to a Zenodo record of the state of the branch of code used for this project (https://github.com/henryaddison/mlde/tree/cordex-ml).

