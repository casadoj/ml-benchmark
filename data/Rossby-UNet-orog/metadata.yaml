# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) when a maintainer adds the `approved` label, and it
# is the source of the "Models contributing to the benchmark" table in README.md.
# Edit it by hand only to fix mistakes; never edit the README table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the README table.
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the README table, e.g.
#                            "Author et al., 2025". null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `approved` label was added (YYYY-MM-DD, UTC).
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.
#

# --- Submission issue ---------------------------------------------------------
emulator_id: Rossby-UNet-orog
institution_id: SMHI
institution: Swedish Meteorological and Hydrological Institute
short_description: U-Net + CBAM (5 enc/dec layers)
description: |-
  A UNet-based machine learning univariate downscaling model with five encoding and five decoding layers, as well as a bottleneck layer and a convolutional block attention module (CBAM) in the middle. The number of channels in the input layer is 16, a GroupNorm normalization (16 channels per group) is applied in every UNet layer, a dropout of 0.1 is used in every encoding layer and a higher dropout of 0.3 is used in the bottleneck. SiLU activation function is used across the whole network.

  Predictors and predictands are (de)standardized using local (per gridpoint) monthly climatologies of the training period. The standardization is performed offline, while the destandardized outputs are produced directly during the inference time. When destandardizing the output of the precipitation model, all negative values are set to zero. The predictors are interpolated bicubically to the predictand (high-resolution) grid in the input layer of the UNet. They are further complemented with high-resolution coordinate grid scaled to [0, 1] range and time encodings. High resolution orography, scaled to [0, 1] range, can be added to the predictors as well. The last four years of the training set (1977-1980 for the ESD_pseudo_reality and 2096-2099 for the Emulator_hist_future) are reserved for validation.

  A combined MSE-FFT loss function is used to train both precipitation and maximum temperature models. MSE and FFT contributions are weighed equally. FFT loss contribution is computed by taking a MSE of the magnitude and phase components of the 2D discrete Fourier transforms of the model output and the ground truth.

  AdamW optimizer with a maximum learning rate of 1E-4, a weight decay of 1E-4 and a batch size of 64 is used to train the model for a total of 25 epochs. OneCycleLR scheduler is used to control the learning rate during the training.
hardware_training_details: |-
  Hardware: single NVIDIA A40 GPU (48 GB). Training time: <1 minute per epoch, ~10 minutes per model training (25 epochs). Inference time: ~1 second per year of predictions.
stochastic_output: false
reference_label: null
reference_url: null
reproducibility_url: https://github.com/fuentesfranco/detex/tree/cordex-ml
additional_notes: |-
  Reference URL (from the submission issue): To be added (the GitHub repo with the code will be kept private until the publication is submitted, but the access can be given upon request)

