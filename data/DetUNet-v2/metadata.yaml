# Metadata of a model contributing to the benchmark.
#
# One file per model, stored as data/<MODEL>/metadata.yaml. It is normally written
# automatically from the submission issue (.github/ISSUE_TEMPLATE/
# ml_benchmark_submission.yaml) when a maintainer adds the `approved` label, and it
# is the source of the "Models contributing to the benchmark" table in README.md.
# Edit it by hand only to fix mistakes; never edit the README table directly.
#
# Fields
# ------
# Fields from the submission issue (keys match the `id` of each form field):
# emulator_id                Model identifier, `{emulator name}-{version}`, with the
#                            suffix `-orog` if orography is used as a predictor. It
#                            must match the directory data/<MODEL>.
# institution_id             Short acronym of the institution.
# institution                Full name of the institution.
# short_description          One-line description shown in the README table.
# description                Detailed description of the method (architecture, loss,
#                            optimizer, predictors, standardization, ...).
# hardware_training_details  Hardware, training time and inference time.
# stochastic_output          true if the emulator generates stochastic realizations
#                            (generative/probabilistic models), false otherwise.
# reference_label            Citation text shown in the README table, e.g.
#                            "Author et al., 2025". null -> "In preparation".
# reference_url              URL of the reference (DOI, publication, docs).
#                            null -> no link.
# reproducibility_url        URL of the code/data for reproducibility (GitHub,
#                            Zenodo, ...). null -> "In preparation".
# additional_notes           Any other relevant information (optional).
#
# Fields added by the registration workflow:
# issue                      Number of the submission issue in the repository.
# submitted                  Date the issue was opened (YYYY-MM-DD, UTC).
# approved                   Date the `approved` label was added (YYYY-MM-DD, UTC).
#
# Optional fields (from the form or unknown for older models) are `null`; they are
# never filled with guessed values.
#

# --- Submission issue ---------------------------------------------------------
emulator_id: DetUNet-v2
institution_id: ESNZ
institution: Earth Sciences New Zealand
short_description: U-Net + self-attention + FiLM (~3M params)
description: |-
  Model Architecture

  The model uses a standard U-Net architecture with residual convolution layers (~3 million parameters). Low-resolution fields interact at the latent space level without upsampling, with self-attention applied at this stage. FiLM layers incorporate day-of-year embeddings, and channel attention is used throughout. Code: https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models.
  Training: Adam optimizer with learning rate decay (initial: XXX × 10⁻⁵, decay: 0.9985 per 1000 steps), batch size 16, MSE loss, no batch normalization. Three years per simulation used for validation. Hyperparameters in config files.
  Normalization: Variables trained independently. Precipitation uses log normalization (z = logₑ(pr + 1)) with leaky ReLU (U-Net) or linear activation (GAN). Temperature normalized by grid-point mean/std with leaky ReLU (U-Net). Predictors normalized by spatiotemporal mean. Static predictors use global min-max normalization. Training normalization reapplied at inference.
hardware_training_details: |-
  Training is performed on a single A100 GPU with 10 CPUs and 120GB RAM. ESD runs require approximately 60 seconds per epoch (6 hours for 250 epochs), while Emul_hist_future runs require 287 seconds per epoch (20 hours for 250 epochs).
  Inference takes 0.4-0.6 seconds per year per ensemble member on an A100 GPU, excluding data processing time.
stochastic_output: false
reference_label: Rampal et al., 2025
reference_url: https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2024MS004668
reproducibility_url: https://github.com/nram812/Generative-CORDEX-ML-Bench/tree/main/models
additional_notes: |-
  TODO: Initial learning rate smaller than DetUNet (identify).
  Info taken from DetUNet as there isn't a GitHub issue assigned to this model.

